services:
  metric:
    build: .
    image: linka-looks-metric:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:30812:30812"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/app/metric-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
